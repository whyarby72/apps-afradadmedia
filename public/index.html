<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Apps AfradadMedia — Deployment Foundation</title>
  <style>
    :root {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      color-scheme: light dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(680px, 100%);
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 20px;
      padding: clamp(28px, 6vw, 56px);
      background: Canvas;
      box-shadow: 0 18px 60px color-mix(in srgb, CanvasText 10%, transparent);
    }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }
    p {
      margin: 20px 0 0;
      max-width: 58ch;
      font-size: 1rem;
      opacity: 0.8;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding: 8px 12px;
      border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 650;
    }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Apps AfradadMedia</p>
    <h1>Deployment foundation</h1>
    <p>This temporary static page exists only to verify the future GitHub-to-hosting delivery path. Product pages and compliance surfaces have not been published from this bootstrap artifact.</p>
    <div class="status" role="status">Bootstrap artifact — not a product release</div>
  </main>
</body>
</html>
